<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoomies — Episode Directory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0f0e0c;
      --paper: #f5f2eb;
      --paper-warm: #ede8dc;
      --paper-mid: #e0dace;
      --muted: #7a7570;
      --accent-green: #1a6b3c;
      --accent-green-light: #d4edda;
      --accent-red: #8b1a1a;
      --accent-red-light: #fde0e0;
      --accent-amber: #8b5a00;
      --border: #c8c2b6;
    }

    html { font-size: 15px; }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Header ── */
    header {
      background: var(--ink);
      color: var(--paper);
      padding: 24px 40px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      border-bottom: 2px solid #333;
    }

    .header-brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: 0.06em;
    }

    .header-sub {
      font-size: 0.72rem;
      color: #888;
      margin-top: 4px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .header-right {
      font-size: 0.75rem;
      color: #666;
      text-align: right;
    }

    /* ── Main ── */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 48px 40px;
    }

    /* ── Show section ── */
    .show-section {
      margin-bottom: 56px;
    }

    .show-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    /* ── Episode card ── */
    .episode-card {
      display: flex;
      align-items: center;
      gap: 20px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 20px 24px;
      margin-bottom: 10px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .episode-card:hover {
      border-color: var(--ink);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .episode-card.complete {
      border-left: 3px solid var(--accent-green);
    }

    .episode-card.in-progress {
      border-left: 3px solid var(--accent-amber);
    }

    .episode-card.not-started {
      border-left: 3px solid var(--border);
    }

    /* ── Episode number badge ── */
    .ep-badge {
      font-family: 'Syne', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--muted);
      min-width: 52px;
      flex-shrink: 0;
    }

    /* ── Episode info ── */
    .ep-info { flex: 1; min-width: 0; }

    .ep-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ep-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 3px;
    }

    /* ── Progress section ── */
    .ep-progress {
      flex-shrink: 0;
      width: 200px;
      text-align: right;
    }

    .progress-track {
      height: 4px;
      background: var(--paper-mid);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--accent-green);
      transition: width 0.3s ease;
    }

    .progress-fill.partial { background: var(--accent-amber); }

    .progress-label {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .progress-label .count-approved { color: var(--accent-green); font-weight: 500; }
    .progress-label .count-rejected { color: var(--accent-red); }

    /* ── Chevron ── */
    .ep-arrow {
      font-size: 1rem;
      color: var(--border);
      flex-shrink: 0;
      transition: color 0.12s, transform 0.12s;
    }
    .episode-card:hover .ep-arrow {
      color: var(--ink);
      transform: translateX(2px);
    }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 80px 32px;
      color: var(--muted);
    }

    .empty-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--ink);
    }

    .empty-sub { font-size: 0.82rem; }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 80px 32px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* ── Error ── */
    .error-msg {
      background: var(--accent-red-light);
      border: 1px solid var(--accent-red);
      border-radius: 4px;
      padding: 16px 20px;
      font-size: 0.82rem;
      color: var(--accent-red);
      margin-bottom: 24px;
    }

    /* ── Refresh button ── */
    .refresh-btn {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: all 0.12s;
    }
    .refresh-btn:hover { border-color: var(--ink); color: var(--ink); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="header-brand">ZOOMIES</div>
    <div class="header-sub">Production Pipeline</div>
  </div>
  <div class="header-right" id="header-right">
    <button class="refresh-btn" onclick="load(true)">Refresh</button>
  </div>
</header>

<main id="main">
  <div class="loading" id="loading">Loading episodes...</div>
</main>

<script>
  const SHOW_LABELS = {
    catwives: 'The Real Catwives of Beverly Hills',
    bloodhound: 'CSI: Bloodhound Bureau',
  };

  async function load(force = false) {
    const main = document.getElementById('main');
    if (force) {
      main.innerHTML = '<div class="loading">Refreshing...</div>';
    }

    try {
      const res = await fetch('/api/episodes');
      if (!res.ok) throw new Error(await res.text());
      const { episodes } = await res.json();
      render(episodes);
    } catch (err) {
      main.innerHTML = `
        <div class="error-msg">Failed to load episodes: ${escapeHtml(err.message)}</div>
        <div style="text-align:center">
          <button class="refresh-btn" onclick="load(true)">Try again</button>
        </div>
      `;
    }
  }

  function render(episodes) {
    const main = document.getElementById('main');

    if (episodes.length === 0) {
      main.innerHTML = `
        <div class="empty">
          <div class="empty-title">No episodes found</div>
          <div class="empty-sub">Run <code>zoomies intake &lt;script&gt;</code> to add your first episode.</div>
        </div>
      `;
      return;
    }

    // Group by show
    const grouped = {};
    for (const ep of episodes) {
      const show = ep.show || 'unknown';
      if (!grouped[show]) grouped[show] = [];
      grouped[show].push(ep);
    }

    main.innerHTML = '';

    for (const [show, showEps] of Object.entries(grouped)) {
      const section = document.createElement('div');
      section.className = 'show-section';

      const label = SHOW_LABELS[show] || show;
      section.innerHTML = `<div class="show-title">${escapeHtml(label)}</div>`;

      for (const ep of showEps) {
        section.appendChild(buildEpisodeCard(ep));
      }

      main.appendChild(section);
    }

    // Update header count
    document.getElementById('header-right').innerHTML = `
      <span style="font-size:0.75rem; color:#666; margin-right:12px">${episodes.length} episode${episodes.length !== 1 ? 's' : ''}</span>
      <button class="refresh-btn" onclick="load(true)">Refresh</button>
    `;
  }

  function buildEpisodeCard(ep) {
    const total = ep.shotCount;
    const approved = ep.approvedCount;
    const rejected = ep.rejectedCount;
    const pending = ep.pendingCount;

    const pct = total > 0 ? Math.round((approved / total) * 100) : 0;
    const reviewed = approved + rejected;
    const isComplete = approved === total && total > 0;
    const isInProgress = reviewed > 0 && !isComplete;

    const cardClass = isComplete ? 'complete' : isInProgress ? 'in-progress' : 'not-started';
    const fillClass = isComplete ? '' : isInProgress ? 'partial' : '';

    const a = document.createElement('a');
    a.className = `episode-card ${cardClass}`;
    a.href = `/episode/${ep.folderId}`;

    a.innerHTML = `
      <div class="ep-badge">S${ep.season}E${String(ep.episode).padStart(2, '0')}</div>
      <div class="ep-info">
        <div class="ep-title">${escapeHtml(ep.title)}</div>
        <div class="ep-meta">${total} shots &nbsp;·&nbsp; ${ep.season > 0 ? `Season ${ep.season}` : ''}</div>
      </div>
      <div class="ep-progress">
        <div class="progress-track">
          <div class="progress-fill ${fillClass}" style="width:${pct}%"></div>
        </div>
        <div class="progress-label">
          <span class="count-approved">${approved} approved</span>
          ${rejected > 0 ? ` &nbsp;·&nbsp; <span class="count-rejected">${rejected} rejected</span>` : ''}
          ${pending > 0 ? ` &nbsp;·&nbsp; ${pending} pending` : ''}
        </div>
      </div>
      <div class="ep-arrow">›</div>
    `;

    return a;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  load();
</script>
</body>
</html>
